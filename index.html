<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="私密、瀏覽器端的 STEP 3D 檢視器" />
    <title>STEP 3D Viewer</title>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand"><span class="brand-mark">3D</span><div><h1>STEP 3D Viewer</h1><p>私密的瀏覽器端 CAD 檢視器</p></div></div>
        <div class="header-actions">
          <label class="quality-control"><span>品質</span><select id="qualitySelect"><option value="draft">草稿（較快）</option><option value="balanced">平衡</option><option value="fine" selected>精細</option><option value="ultra">極致（最精細）</option></select></label>
          <button class="button" id="clearBtn" hidden>清除</button>
          <label class="button primary" for="fileInput">選擇 STEP 檔<input id="fileInput" type="file" accept=".stp,.step" hidden /></label>
        </div>
      </header>
      <main id="main">
        <div id="viewer"></div>
        <nav class="toolbar" aria-label="檢視工具">
          <button class="tool active" id="solidBtn" title="實體顯示" aria-label="實體顯示"><svg viewBox="0 0 24 24"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z"/><path d="m4 6.5 8 4.5 8-4.5M12 11v9"/></svg></button>
          <button class="tool" id="wireBtn" title="線框顯示" aria-label="線框顯示"><svg viewBox="0 0 24 24"><path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2ZM4 6.5l8 4.5 8-4.5M12 11v9M4 15.5l8-4.5 8 4.5"/></svg></button><i></i>
          <button class="tool active" id="gridBtn" title="格線" aria-label="格線"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18M7 3v18m5-18v18m5-18v18"/></svg></button>
          <button class="tool active" id="axisBtn" title="座標軸" aria-label="座標軸"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M5 19V7m0 12h12"/><path d="m15 5 4 0 0 4"/></svg></button>
          <button class="tool" id="themeBtn" title="切換淺色背景" aria-label="切換背景"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button><i></i>
          <button class="tool" id="fitBtn" title="適應畫面" aria-label="適應畫面"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg></button>
          <button class="tool" id="resetBtn" title="重設視角" aria-label="重設視角"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></button>
          <button class="tool" id="hideUiBtn" title="隱藏介面" aria-label="隱藏介面"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="m4 4 16 16"/></svg></button>
        </nav>
        <section class="drop-zone" id="dropZone">
          <div class="upload-orbit">↑</div><h2>開啟 STEP 模型</h2>
          <p>拖曳 <b>.stp</b> 或 <b>.step</b> 檔案到這裡，或按下方按鈕選擇檔案。</p>
          <label class="button primary" for="fileInput">選擇本機檔案</label>
        </section>
        <section class="info-card hidden" id="infoCard"><div class="file-name" id="fileName"></div><div class="file-state">已在此裝置完成解析</div><div class="stats"><div><span>網格</span><strong id="meshes">—</strong></div><div><span>三角形</span><strong id="faces">—</strong></div><div><span>尺寸 XYZ</span><strong id="size">—</strong></div></div></section>
        <section class="privacy-note">STEP 檔案不會離開您的裝置</section>
        <section class="loading hidden" id="loading" aria-live="polite"><div class="loading-box"><div class="loader"></div><strong id="loadingTitle">讀取檔案</strong><p id="loadingNote">正在準備本機解析器…</p><div class="progress"><i></i></div><button class="cancel-load" id="cancelLoadBtn" type="button">取消載入</button></div></section>
        <div class="toast" id="toast" role="alert"></div>
        <button class="ui-peek" id="showUiBtn" title="顯示介面" aria-label="顯示介面"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
