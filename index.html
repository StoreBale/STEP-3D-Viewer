<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="在瀏覽器中開啟 STEP 3D 模型" />
    <title>STEP 3D Viewer</title>
  </head>
  <body>
    <main class="workspace" id="main">
      <div id="viewer"></div>
      <div class="model-name" id="fileName" hidden></div>

      <section class="drop-zone" id="dropZone">
        <div class="upload-icon">↥</div>
        <h1>開啟 STEP 檔案</h1>
        <p>拖曳 <b>.stp</b> 或 <b>.step</b> 檔案到這裡</p>
        <label class="open-button" for="fileInput">選擇檔案</label>
      </section>
      <input id="fileInput" type="file" accept=".stp,.step" hidden />

      <div class="view-cube" aria-label="視角方向控制">
        <canvas id="viewCubeCanvas" width="192" height="192" aria-label="前後左右上下方向方塊"></canvas>
        <div class="cube-turns" aria-label="畫面旋轉 45 度">
          <button id="turnLeftBtn" title="逆時針旋轉 45 度">↶</button>
          <button id="turnRightBtn" title="順時針旋轉 45 度">↷</button>
        </div>
      </div>

      <nav class="basic-toolbar" id="basicToolbar" aria-label="基本功能">
        <button id="fitBtn" title="回到原點並讓模型適合視窗">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-6v-6h-4v6H4Z"/></svg>
          <span>回到原點</span>
        </button>
        <button id="edgesBtn" class="active" title="顯示或隱藏模型邊線">
          <svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
          <span>邊線</span>
        </button>
        <button id="openBtn" title="開啟另一個 STEP 檔案">
          <svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3Z"/><path d="M12 12v5m-2.5-2.5h5"/></svg>
          <span>開啟檔案</span>
        </button>
        <button id="fullscreenBtn" title="進入全螢幕">
          <svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          <span id="fullscreenLabel">全螢幕</span>
        </button>
        <button id="hideToolbarBtn" title="隱藏功能列">
          <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><path d="m4 4 16 16"/></svg>
          <span>隱藏</span>
        </button>
      </nav>
      <button class="toolbar-reveal" id="showToolbarBtn" title="顯示功能列" aria-label="顯示功能列">
        <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>

      <section class="loading hidden" id="loading" aria-live="polite">
        <div>
          <div class="spinner"></div>
          <strong id="loadingTitle">正在讀取模型</strong>
          <p id="loadingNote">請稍候</p>
          <div class="load-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <i id="progressBar"></i>
          </div>
          <output id="progressValue">0%</output>
          <button id="cancelLoadBtn" type="button">取消</button>
        </div>
      </section>
      <div class="toast" id="toast" role="alert"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
